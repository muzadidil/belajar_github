<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>belajar_github — Game Terminal Git</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="terminal" id="terminal">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title">C:\belajar_github&gt; cmd.exe — Game Git</span>
      </div>

      <div class="statusbar">
        <span id="st-fase">FASE 1</span>
        <span id="st-soal">SOAL 1/50</span>
        <span id="st-nyawa">❤❤❤</span>
        <span id="st-skor">SKOR 0</span>
        <span id="st-mode">● ...</span>
      </div>

      <div class="screen" id="screen"></div>

      <div class="inputline" id="inputline">
        <span class="ps" id="ps">guest@github MINGW64 ~/belajar_github$</span>
        <input
          id="cmd"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="ketik perintah git"
        />
      </div>
    </div>
    <p class="footer">Ketik perintah git untuk menjawab misi. <b>Dilarang paste</b> — latih muscle memory. Bantuan: <code>:help</code></p>
  </div>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Game -->
  <script src="js/levels.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
